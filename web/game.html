<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Urban Chaos — Web</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; font-family: system-ui, sans-serif; overflow: hidden;
    overscroll-behavior: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.85)), url(capsule.jpg) center / cover no-repeat #000; }
  #overlay h1 { margin: 0; font-size: 42px; letter-spacing: 6px; color: #fff; text-shadow: 0 2px 18px #000; }
  #back { position: fixed; left: 16px; top: 12px; color: #aaa; font-size: 13px; text-decoration: none; }
  #back:hover { color: #fff; }
  #status { font-size: 15px; min-height: 1.2em; }
  #bar { width: 320px; height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: #d33; transition: width .15s; }
  #play { font-size: 20px; padding: 12px 42px; background: #a11; color: #fff; border: 0; border-radius: 4px; cursor: pointer; display: none; }
  #play:hover { background: #c22; }
  #hint { font-size: 12px; color: #777; text-align: center; line-height: 1.6; }
  #loading { position: fixed; right: 12px; bottom: 10px; font-size: 12px; color: #888; pointer-events: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="overlay">
  <a id="back" href="index.html"></a>
  <h1 id="title">URBAN CHAOS</h1>
  <div id="status"></div>
  <div id="bar"><div></div></div>
  <button id="play"></button>
  <div id="hint"></div>
</div>
<div id="loading"></div>
<script>
const LANG = new URLSearchParams(location.search).get('lang') === 'ru' ? 'ru' : 'en';
const OC_TEXT = {
  en: {
    back: '← Launcher', play: 'Play', ready: 'Ready', error: 'Error: ',
    manifest: 'Loading resource list…', engine: 'Loading engine…', engineFail: 'Failed to load openchaos.js',
    loading: 'Loading: ', rotate: 'Rotate your device to landscape',
    hint: 'Game resources are streamed on demand.<br>Saves are stored in your browser (IndexedDB). F11 — fullscreen.',
    hintTouch: 'Touch controls: left half — move, right half — camera, buttons — actions.<br>A gamepad also works. Saves are stored in your browser.',
  },
  ru: {
    back: '← Лаунчер', play: 'Играть', ready: 'Готово', error: 'Ошибка: ',
    manifest: 'Загрузка списка ресурсов…', engine: 'Загрузка движка…', engineFail: 'Не удалось загрузить openchaos.js',
    loading: 'Загрузка: ', rotate: 'Поверните устройство горизонтально',
    hint: 'Ресурсы игры подгружаются по мере необходимости.<br>Сохранения хранятся в браузере (IndexedDB). F11 — полный экран.',
    hintTouch: 'Сенсорное управление: левая половина — движение, правая — камера, кнопки — действия.<br>Геймпад тоже работает. Сохранения хранятся в браузере.',
  },
}[LANG];
</script>
<script src="touch.js"></script>
<script>
'use strict';
const statusEl = document.getElementById('status');
const barEl = document.querySelector('#bar > div');
const playBtn = document.getElementById('play');
const loadingEl = document.getElementById('loading');
const GAME_ROOT = '/game';
const SAVE_ROOT = '/libsdl';

window.__ocLog = [];
function ocLog(t) {
  __ocLog.push(String(t));
  if (__ocLog.length > 500) __ocLog.shift();
}
window.addEventListener('error', (e) => ocLog('JS error: ' + (e.error && e.error.stack || e.message)));
window.addEventListener('unhandledrejection', (e) => ocLog('Unhandled: ' + (e.reason && e.reason.stack || e.reason)));

document.documentElement.lang = LANG;
document.getElementById('back').textContent = OC_TEXT.back;
playBtn.textContent = OC_TEXT.play;
document.getElementById('hint').innerHTML = OCTouch.isTouchDevice ? OC_TEXT.hintTouch : OC_TEXT.hint;
// In-game path -> URL under data/ (the Russian manifest mixes data/ru and data/en).
const assetUrls = new Map();
function assetUrl(real) {
  return 'data/' + assetUrls.get(real).split('/').map(encodeURIComponent).join('/');
}

let pending = 0;
function showLoading(delta, name) {
  pending += delta;
  loadingEl.textContent = pending > 0 ? OC_TEXT.loading + name : '';
}

async function fetchAsset(real) {
  showLoading(1, real);
  try {
    const url = assetUrl(real);
    for (let attempt = 0; ; attempt++) {
      try {
        const r = await fetch(url);
        if (!r.ok) throw new Error(r.status + ' ' + url);
        return new Uint8Array(await r.arrayBuffer());
      } catch (e) {
        if (attempt >= 3) throw e;
        await new Promise((res) => setTimeout(res, 500 * (attempt + 1)));
      }
    }
  } finally {
    showLoading(-1, '');
  }
}

var Module = {
  canvas: document.getElementById('canvas'),
  ocGameRoot: GAME_ROOT,
  ocLang: LANG,
  ocManifest: new Map(),
  ocLoaded: new Set(),
  ocFetchAsset: fetchAsset,
  print: (t) => { console.log(t); ocLog(t); },
  printErr: (t) => { console.warn(t); ocLog(t); },
  setStatus: (t) => { if (t) statusEl.textContent = t; },
  preRun: [() => {
    FS.mkdir(GAME_ROOT);
    // Empty placeholders so directory listings see every game file; the real
    // contents are fetched when the game opens a file (oc_web_fetch_asset).
    for (const real of Module.ocManifest.values()) {
      const full = GAME_ROOT + '/' + real;
      FS.mkdirTree(full.substring(0, full.lastIndexOf('/')));
      FS.writeFile(full, new Uint8Array(0));
    }
    FS.mkdir(SAVE_ROOT);
    FS.mount(IDBFS, {}, SAVE_ROOT);
    addRunDependency('idbfs');
    FS.syncfs(true, (err) => {
      if (err) console.warn('IDBFS load failed', err);
      removeRunDependency('idbfs');
    });
    FS.chdir(GAME_ROOT);
  }],
  onRuntimeInitialized: () => {
    statusEl.textContent = OC_TEXT.ready;
    barEl.style.width = '100%';
    playBtn.style.display = 'block';
  },
  onAbort: (what) => {
    document.getElementById('overlay').style.display = 'flex';
    statusEl.textContent = OC_TEXT.error + what;
  },
};

// Bink video -> <video> overlay. Resolves 1 when played (or skipped), 0 if missing.
Module.ocPlayVideo = (path, allowSkip) => new Promise((resolve) => {
  const name = path.split('/').pop().replace(/\.bik$/i, '.mp4');
  const real = Module.ocManifest.get(('bink_web/' + name).toLowerCase());
  if (!real) { resolve(0); return; }
  const v = document.createElement('video');
  v.src = assetUrl(real);
  v.playsInline = true;
  v.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;background:#000;object-fit:contain;z-index:10';
  let done = false;
  const SKIP_KEYS = ['Escape', 'Enter', ' '];
  const onKey = (e) => {
    // The game must not see input meant for the video (e.g. Enter in the menu).
    e.preventDefault();
    e.stopImmediatePropagation();
    if (e.type === 'keydown' && allowSkip && SKIP_KEYS.includes(e.key)) finish(1);
  };
  const onClick = (e) => { e.preventDefault(); e.stopImmediatePropagation(); if (allowSkip) finish(1); };
  function finish(result) {
    if (done) return;
    done = true;
    window.removeEventListener('keydown', onKey, true);
    window.removeEventListener('keyup', onKey, true);
    v.removeEventListener('click', onClick);
    v.pause();
    v.remove();
    Module.canvas.focus();
    resolve(result);
  }
  window.addEventListener('keydown', onKey, true);
  window.addEventListener('keyup', onKey, true);
  v.addEventListener('click', onClick);
  v.addEventListener('ended', () => finish(1));
  v.addEventListener('error', () => finish(0));
  document.body.appendChild(v);
  v.play().catch(() => {
    // Autoplay with sound refused: retry muted rather than skip the video.
    v.muted = true;
    v.play().catch(() => finish(0));
  });
});

let syncing = false;
Module.ocSyncSaves = () => {
  if (syncing) return;
  syncing = true;
  FS.syncfs(false, (err) => {
    syncing = false;
    if (err) console.warn('IDBFS save failed', err);
  });
};
setInterval(() => { if (Module.calledRun) Module.ocSyncSaves(); }, 5000);
window.addEventListener('beforeunload', () => Module.ocSyncSaves());

playBtn.addEventListener('click', async () => {
  playBtn.style.display = 'none';
  document.getElementById('overlay').style.display = 'none';
  const canvas = Module.canvas;
  canvas.focus();
  if (OCTouch.isTouchDevice) {
    OCTouch.enable();
    OCTouch.toggleFullscreen();
  } else {
    window.addEventListener('touchstart', () => OCTouch.enable(), { once: true, passive: true });
  }
  Module.callMain([]);
});

// A real gamepad takes over from the on-screen controls; they return when it is unplugged.
let realPads = 0;
window.addEventListener('gamepadconnected', (e) => {
  if (e.gamepad && !e.gamepad.id.startsWith('Touch Controls')) { realPads++; OCTouch.setVisible(false); }
});
window.addEventListener('gamepaddisconnected', (e) => {
  if (e.gamepad && !e.gamepad.id.startsWith('Touch Controls')) OCTouch.setVisible(--realPads <= 0);
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'F11') {
    e.preventDefault();
    OCTouch.toggleFullscreen();
  }
});

(async () => {
  if (LANG === 'ru') {
    document.getElementById('title').textContent = 'URBAN CHAOS · RU';
    document.title = 'Urban Chaos — русская версия';
  }
  statusEl.textContent = OC_TEXT.manifest;
  const manifest = await (await fetch('manifest_' + LANG + '.json')).json();
  for (const [p, , url] of manifest) {
    Module.ocManifest.set(p.toLowerCase(), p);
    assetUrls.set(p, url);
  }
  statusEl.textContent = OC_TEXT.engine;
  barEl.style.width = '30%';
  const s = document.createElement('script');
  s.src = 'openchaos.js';
  s.onerror = () => { statusEl.textContent = OC_TEXT.engineFail; };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
